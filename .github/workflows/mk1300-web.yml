name: mk1300-web

on:
  push:
    paths: ['mk1300-web/**', 'mk1300-mac/build/**', '.github/workflows/mk1300-web.yml']
  pull_request:
    paths: ['mk1300-web/**', 'mk1300-mac/build/**', '.github/workflows/mk1300-web.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mk1300-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mk1300-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # vercel.json is generated by the build; fail if the committed copy is stale.
      - name: Committed vercel.json matches the build
        run: git diff --exit-code -- vercel.json
